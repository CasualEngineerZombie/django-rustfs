[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "django-rustfs"
version = "0.1.0"
description = "A plug-and-play Django storage backend for RustFS - the high-performance, S3-compatible object storage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Rian", email = "rian@pythonist.dev" }]
keywords = [
    "django",
    "rustfs",
    "s3",
    "storage",
    "object-storage",
    "file-storage",
    "minio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "moto>=5.1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.1.0",
    "moto>=4.2.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "django-stubs>=4.2.0",
]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.1.0"]

[project.urls]
Homepage = "https://github.com/CasualEngineerZombie/django-rustfs"
Documentation = "https://django-rustfs.readthedocs.io"
Repository = "https://github.com/CasualEngineerZombie/django-rustfs"
Issues = "https://github.com/CasualEngineerZombie/django-rustfs/issues"
Changelog = "https://github.com/CasualEngineerZombie/django-rustfs/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["django_rustfs"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "--cov=django_rustfs --cov-report=term-missing --cov-fail-under=90"
